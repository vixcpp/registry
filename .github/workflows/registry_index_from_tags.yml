name: Registry index from tags

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-index-from-tags
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate versions from tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python .github/scripts/index_from_tags.py

      - name: Create or update PR and enable auto-merge (if changes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          BRANCH="bot/registry-index-from-tags"

          # reset branch from current main
          git switch -C "$BRANCH"

          git add index/*.json
          git commit -m "registry: update versions from tags"
          git push -u origin "$BRANCH" --force

          PR_URL=""
          if gh pr view "$BRANCH" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            PR_URL="$(gh pr view "$BRANCH" --repo "${{ github.repository }}" --json url -q .url)"
            echo "PR already exists: $PR_URL"
          else
            PR_URL="$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "registry: update versions from tags" \
              --body "Automated update of index versions from Git tags." \
              --json url -q .url)"
            echo "PR created: $PR_URL"
          fi

          # Force enable auto-merge every run (force-push can disable it)
          gh pr edit "$PR_URL" --repo "${{ github.repository }}" --enable-auto-merge --squash
          echo "Auto-merge enabled for: $PR_URL"
