name: Registry auto-merge (conditional)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            index/**/*.json

      - name: Setup Python
        if: ${{ steps.changes.outputs.any_changed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate registry PR
        if: ${{ steps.changes.outputs.any_changed == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/validate_registry_pr.py

      - name: Merge PR (squash + delete branch)
        if: ${{ steps.changes.outputs.any_changed == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "${{ github.repository }}"

      - name: Skip (no index changes)
        if: ${{ steps.changes.outputs.any_changed != 'true' }}
        run: |
          echo "No index/*.json changes in this PR. Skipping registry validation and auto-merge."
